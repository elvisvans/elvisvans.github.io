name: Sync 留燈客棧 web build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths:
      - '.github/workflows/sync-game.yml'

permissions:
  contents: write

concurrency:
  group: sync-game
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download public game repo
        run: |
          set -euo pipefail
          rm -rf /tmp/game-src
          mkdir -p /tmp/game-src
          curl -fsSL https://codeload.github.com/elvisvans/liudeng-inn-web/tar.gz/refs/heads/main \
            | tar -xz -C /tmp/game-src --strip-components=1
          # Remove old root game files but NEVER delete baystay/ (co-hosted site)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'baystay' -exec rm -rf {} +
          # Copy game tree excluding github metadata from source; never overwrite baystay/
          shopt -s dotglob nullglob
          for item in /tmp/game-src/*; do
            base=$(basename "$item")
            case "$base" in
              .git|.github|README.md|baystay) ;;
              *) cp -a "$item" ./ ;;
            esac
          done
          test -f index.html
          test -d baystay || echo "WARN: baystay/ missing after sync (should have been preserved)"
          ls -la | head -30

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Sync 留燈客棧 web build from liudeng-inn-web"
          git push
