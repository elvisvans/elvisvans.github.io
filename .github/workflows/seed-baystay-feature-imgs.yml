name: seed-baystay-feature-imgs
on:
  workflow_dispatch:
  push:
    paths:
      - "baystay/assets/features/*.jpg.b64"
      - ".github/workflows/seed-baystay-feature-imgs.yml"
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode feature JPGs from b64
        run: |
          set -euo pipefail
          mkdir -p baystay/assets/features
          shopt -s nullglob
          for b in baystay/assets/features/*.jpg.b64; do
            out="${b%.b64}"
            base64 -d "$b" > "$out"
            ls -la "$out"
            file "$out" || true
          done
          # never touch hero
          test ! -f baystay/assets/hero-home.jpg.b64
          ls -la baystay/assets/features/
      - name: Commit JPGs (keep b64 for audit or remove)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baystay/assets/features/*.jpg
          # drop b64 after decode to avoid bloat
          git rm -f baystay/assets/features/*.jpg.b64 || true
          if git diff --cached --quiet; then
            echo "no image changes"
            exit 0
          fi
          git commit -m "baystay(20261019f): seed feature JPGs (cotai/chelsea) from b64"
          git push
