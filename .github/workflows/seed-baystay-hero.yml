name: seed-baystay-hero
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/seed-baystay-hero.yml"
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and write hero-home.jpg
        run: |
          mkdir -p baystay/assets
          curl -fsSL -o /tmp/hero-src.jpg \
            "https://upload.wikimedia.org/wikipedia/commons/9/99/Cheoc_Van_Beach_12-03-2024%283%29.jpg"
          # Prefer ImageMagick resize if present; else copy full file
          if command -v convert >/dev/null 2>&1; then
            convert /tmp/hero-src.jpg -resize 1920x1920\> -quality 85 baystay/assets/hero-home.jpg
          else
            cp /tmp/hero-src.jpg baystay/assets/hero-home.jpg
          fi
          ls -la baystay/assets/hero-home.jpg
          file baystay/assets/hero-home.jpg || true
      - name: Commit binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baystay/assets/hero-home.jpg
          if git diff --cached --quiet; then
            echo "hero unchanged"
            exit 0
          fi
          git commit -m "baystay(20261019b): seed hero-home.jpg binary (relative CSS)"
          git push
